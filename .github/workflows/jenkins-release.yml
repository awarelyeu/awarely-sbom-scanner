name: Jenkins plugin release

on:
  push:
    tags: ['jenkins-v*']

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/jenkins-ci.yml
    permissions:
      contents: read
  release:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Authenticate pinned CLI release
        run: python3 jenkins-plugin/scripts/pin-cli.py --check
      - name: Build and package release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mvn -B -ntp -f jenkins-plugin/pom.xml verify
          mvn -B -ntp -f jenkins-plugin/pom.xml org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeBom -DincludeTestScope=false -DincludeProvidedScope=true -DoutputFormat=json
          python3 jenkins-plugin/scripts/package-release.py "$RELEASE_TAG"
      - name: Attest plugin and dependency inventory
        id: provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            dist/jenkins/*.hpi
            dist/jenkins/*.json
      - name: Publish immutable prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          test -s "$BUNDLE_PATH"
          for artifact in dist/jenkins/*.hpi dist/jenkins/*.json; do cp "$BUNDLE_PATH" "$artifact.sigstore.jsonl"; done
          gh release create "$RELEASE_TAG" dist/jenkins/* --verify-tag --prerelease --title "Awarely Scan for Jenkins $RELEASE_TAG" --notes-file jenkins-plugin/docs/release-notes.md
