name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  release:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: false
      - name: Build archives and binary inventories
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          GOTOOLCHAIN: local
        run: python3 scripts/package_release.py "$RELEASE_VERSION"
      - name: Attest release archives
        id: provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*.tar.gz
      - name: Package public verification bundles
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          test -s "$BUNDLE_PATH"
          for archive in dist/*.tar.gz; do
            cp "$BUNDLE_PATH" "$archive.sigstore.jsonl"
          done
      - name: Publish API prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: gh release create "$RELEASE_VERSION" dist/*.tar.gz dist/*.sigstore.jsonl dist/SHA256SUMS --verify-tag --prerelease --title "Awarely Scan $RELEASE_VERSION" --notes-file docs/release-notes.md
